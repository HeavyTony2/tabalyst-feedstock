schema_version: 1

context:
  version: "0.7.4"

package:
  name: tabalyst
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tabalyst/tabalyst-${{ version }}.tar.gz
  sha256: 408fc2fff75cab6d03e0316dffa97611baf43c444a16abc505109d302f8afd90

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - tabalyst = tabalyst.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77
    - pip
  run:
    - python >=${{ python_min }}
    - python-duckdb ==1.5.5
    - ijson >=3.3
    - jinja2 >=3.1
    - platformdirs >=4
    - pydantic >=2.11
    - typer >=0.12
    - pyyaml >=6.0
    - python-calamine >=0.8
tests:
  - python:
      imports:
        - tabalyst
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - tabalyst --help

about:
  summary: Open-source data profiling engine for structured JSON and customizable HTML reports.
  license: MPL-2.0
  license_file: LICENSE
  homepage: https://tabalyst.com/
  repository: https://github.com/loribel-labs/tabalyst
  documentation: https://docs.tabalyst.com/
  decription: Tabalyst helps you understand CSV, Excel, JSON and JSONL datasets with minimal configuration. Detect missing values, duplicates, mixed types, data formats and quality issues. Generate interactive HTML reports and structured JSON profiles, entirely on your computer.

extra:
  recipe-maintainers:
    - HeavyTony2
